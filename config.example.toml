# Copy to ~/.config/jean-paul/config.toml. The three secrets sit beside it:
#   ~/.config/jean-paul/discord_token   (bot token, Discord developer portal → Bot)
#   ~/.config/jean-paul/github_app.pem  (private key, GitHub App settings)
#   ~/.config/jean-paul/shotgrid_key    (the Script's Application Key, ShotGrid → Admin → Scripts)
# Keep all four files mode 600.

[discord]
# Developer Mode on, then right-click → Copy ID.
guild_id = 0
forum_id = 0
maintainer_channel_id = 0

[github]
# GitHub App settings → General → App ID.
app_id = 0
# The repository the App is installed on, where reports become issues.
repo = "owner/name"
# A public repository, also with the App installed, holding files copied from Discord.
attachments_repo = "owner/name-attachments"

[shotgrid]
site = "https://example.shotgunstudio.com"
# The Script's name, from ShotGrid → Admin → Scripts.
script_name = "jean_paul"
# The production whose Notes are delivered: the number in a project page's URL.
project_id = 0
