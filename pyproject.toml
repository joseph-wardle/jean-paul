[project]
name = "jean-paul"
version = "0.1.0"
description = "Files Discord forum posts as GitHub issues for the sandwich-pipeline."
readme = "README.md"
authors = [{ name = "Joseph Wardle" }]
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1,<3",
    "pygithub>=2.10.0,<3",
]

[project.scripts]
jean-paul = "jean_paul.__main__:main"
jean-paul-watchdog = "jean_paul.watchdog:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3,<0.18",
    "ty>=0.0.97",
]

[tool.ruff]
line-length = 100
